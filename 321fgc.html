<!DOCTYPE html>
<html lang="en">

<!-- Head -->
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A home for what I love.">
  <meta name="author" content="J.C. Reyes">
  <title>TMNTfever - 321 FGC</title>
  <link rel="icon" href="assets/icon-tmntfever.png">
  <link href="src/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="src/jquery/jquery.min.js"></script>
  <script src="src/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script type="application/javascript">
    window.onload = function() {
      // Load sidebar HTML into div
      $("#sidebar-wrapper").load("sidebar.html");
    }
  </script>
</head>

<!-- Body -->
<body class="body">

<!-- Wrapper -->
<div id="wrapper" class="">
  <!-- Sidebar Wrapper -->
  <div id="sidebar-wrapper"></div>

  <!-- Page Content -->
  <div id="pg" class="text-light">
    <!-- 321 FGC Page -->
    <div id="pg-321fgc" class="pg">
      <header>
        <h1>321 FGC</h1>
      </header>
      <p>
        <a id="startgg-card" href="https://www.start.gg/321fight" target="_blank" style="display: block; max-width: 500px; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; text-decoration: none; color: inherit; font-family: sans-serif;">
          <img id="startgg-img" src="" alt="321Fight Preview" style="width: 100%; display: none;" />
          <div style="padding: 12px;">
            <strong id="startgg-title" style="display: block; font-size: 16px;">321 FGC on Start.gg</strong>
            <span id="startgg-desc" style="font-size: 13px; color: #FFF;">Click to view upcoming events!</span>
          </div>
        </a>
      </p>
      
      <table>        
        <tr><td><img width=40 src="assets/contact-discord.png" alt="Discord"></td><td><a href="https://discord.gg/TWrp5Gzffe">discord.gg/TWrp5Gzffe</a></td></tr>
        <tr><td><img width=40 src="assets/contact-startgg.png" alt="Start.gg"></td><td><a href="https://www.start.gg/hub/321fgc">start.gg/hub/321fgc</a></td></tr>
        <tr><td><img width=40 src="assets/contact-twitch.png" alt="Twitch.tv"></td><td><a href="https://www.twitch.tv/321fgc">twitch.tv/321fgc</a></td></tr>
        <tr><td><img width=40 src="assets/contact-facebook.png" alt="Facebook"></td><td><a href="https://www.facebook.com/groups/321fgc">facebook.com/groups/321fgc</a></td></tr>
        <tr><td><img width=40 src="assets/contact-reddit.png" alt="Reddit"></td><td><a href="https://www.reddit.com/r/321fgc">reddit.com/r/321fgc</a></td></tr>
        <tr><td><img width=40 src="assets/contact-youtube.png" alt="YouTube"></td><td><a href="https://www.youtube.com/@321FGC">youtube.com/@321FGC</a></td></tr>
        <tr><td><img width=40 src="assets/contact-twitter.png" alt="Twitter/X"></td><td><a href="https://x.com/321_fgc">twitter.com/321_fgc</a></td></tr>
      </table>
    </div>
  </div>
  <!-- /#page-content-wrapper -->
</div>
<!-- /#wrapper -->

<!-- Custom Scripts -->
<script>
  fetch('https://microlink.io')
    .then(res => res.json())
    .then(json => {
      const data = json.data;
      if (data.image && data.image.url) {
        const img = document.getElementById('startgg-img');
        img.src = data.image.url;
        img.style.display = 'block';
      }
      if (data.title) document.getElementById('startgg-title').textContent = data.title;
      if (data.description) document.getElementById('startgg-desc').textContent = data.description;
    });
</script>
</body>
</html>
