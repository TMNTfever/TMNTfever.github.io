<!DOCTYPE html>
<html lang="en">

<!-- Head -->
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The keys to the castle">
  <meta name="author" content="J.C. Reyes">
  <meta property="og:title" content="TMNTfever - Passwords"> 
  <meta property="og:description" content="The keys to the castle"> 
  <meta property="og:image" content="assets/TMNTfever.png"> 
  <meta property="og:url" content="https://tmntfever.github.io/pw.html"> 
  <title>TMNTfever Passwords</title>
  <link rel="icon" href="assets/icon-tmntfever.png">
  <link href="src/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">

<!-- Head Scripts -->
  <script src="src/jquery/jquery.min.js"></script>
  <script src="src/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="src/createTable/createTable.js"></script>
  <script type="application/javascript">
    window.onload = function() {
      // Load sidebar HTML into div
      $("#sidebar-wrapper").load("sidebar.html");
    }
  </script>
</head>

<!-- Body -->
<body class="body">

<!-- Wrapper -->
<div id="wrapper" class="">
  <!-- Sidebar -->
  <div id="sidebar-wrapper"></div>

  <!-- Page Content -->
  <div id="pg" class="text-light">
    <!-- Login Page -->
    <div id="pg-login" name="login" class="pg">
      <header>
        <h1>PASSWORDS</h1>
      </header>
      
      <p>Enter Master Password</p>
      <input type="password" id="master-pw" class="form-control" placeholder="Password">
      <button type="button" id="login-button">Unlock</button>
      <div id="login-error" class="text-danger mt-2" style="display: none;">Incorrect Password</div>
    </div>
    
    <!-- Password Page -->
    <div id="pg-pw" class="pg" style="display: none;">
      <header>
        <h1>PASSWORDS</h1>
      </header>

      <br><input id="search-bar" class="searchInput form-control" data-table-id="pw-table" type="search" placeholder="Search" aria-label="Search" aria-target="pw-table"><br>
      
      <div id="pw-div"></div>
    </div>
  <!-- /#page-content-wrapper -->
</div>
<!-- /#wrapper -->

<!-- Body Scripts -->
<script src="src/SortTable/scripts/searchTable.js"></script>
<script>
  $(document).ready(function() {
    
    // Listen for the login button click
    $('#login-button').click(function() {
      checkPassword();
    });

    // Also allow pressing 'Enter' button in the input box
    $('#master-pw').keypress(function(e) {
      if (e.which == 13) {
        checkPassword();
      }
    });

    async function checkPassword() {
      const enteredPw = $('#master-pw').val().trim();
      if (!enteredPw) return;

      try {
        // SHA-256 hash user input
        const msgUint8 = new TextEncoder().encode(enteredPw);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        // Get passwords file
        $.ajax({
          url: `assets/${hashHex}`,
          dataType: 'text',
          success: function(data) {
            $('#pg-login').hide();
            $('#pg-pw').show();
            $('#login-error').hide();
            $('#pw-div').text(data);
            createTable("pw-div", "pw-table", false, true);
          },
          error: function(xhr) {
            // If the server throws a 404 (Not Found), the token file does not exist
            $('#login-error').fadeIn();
          }
        });
      } catch (err) {
        console.error("Crypto function failed:", err);
        $('#login-error').fadeIn();
      }
    }
  });
</script>

</body>
</html>
